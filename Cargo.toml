[package]
name = "textimg"
version = "0.1.0"
edition = "2021"
description = "Render text files as compact page images so vision LLM agents read them for about half the tokens"
repository = "https://github.com/Sasidhar-Sunkesula/textimg"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
